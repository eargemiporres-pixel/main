# Render Blueprint: crea el servicio web y la base de datos desde este repositorio.
services:
  - type: web
    name: muttto-gestor
    runtime: node
    rootDir: gestor
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: muttto-gestor-db
          property: connectionString
databases:
  - name: muttto-gestor-db
    plan: basic-256mb

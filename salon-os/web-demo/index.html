<meta charset="utf-8">
<title>Salon OS</title>
<meta name="description" content="Demo de Salon OS: panel, clientes, caja y consola del distribuidor con datos de ejemplo.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; text-align: center; background: var(--side); color: #F4EFE8; }
  .boot b { font-family: var(--display); font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .boot p { margin: 0; color: #D6CDC3; max-width: 420px; }
  .boot .bar { width: 180px; height: 4px; border-radius: 2px; background: #3A322D; overflow: hidden; }
  .boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--ochre); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .boot .bar::after { animation: none; width: 100%; } }
  .demo-pill { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--amber-soft); color: var(--amber-ink); border: 1px solid #EBD9BC; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 14px rgba(31, 26, 23, 0.12); }
</style>
<script type="importmap">
{
  "imports": {
    "node:sqlite": "./shims/sqlite.js",
    "node:crypto": "./shims/crypto.js",
    "node:fs": "./shims/node.js",
    "node:fs/promises": "./shims/node.js",
    "node:path": "./shims/node.js",
    "node:url": "./shims/node.js"
  }
}
</script>
<div id="app">
  <div class="boot" role="status">
    <b>Salon OS</b>
    <div class="bar" aria-hidden="true"></div>
    <p id="bootStatus">Cargando la demo…</p>
  </div>
</div>
<div class="demo-pill">Demo · datos de ejemplo · se reinicia al recargar</div>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js"></script>
<script type="module" src="boot.js"></script>
